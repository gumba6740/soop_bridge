# 모든 서비스 공통 로그 설정. 기본 json-file은 용량 제한이 없어서 디스크를 계속 차지한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.1
    container_name: soop_bridge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:8.2-alpine
    container_name: soop_bridge_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # VOD/채팅 수집 크론. supercronic이 PID 1로 돌면서 docker/collector.cron 일정대로 실행한다.
  # 로그 확인: docker compose logs -f review-collector
  # 수동 실행: docker compose exec review-collector scripts/collect.sh vods --bid <bid>
  review-collector:
    build:
      context: .
      dockerfile: docker/review_collector.Dockerfile
    container_name: soop_bridge_review_collector
    restart: unless-stopped
    env_file: .env
    environment:
      PGAPPNAME: review-collector
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # 온디맨드 채팅 수집 워커. review-collector와 같은 이미지에 실행 명령만 다르다.
  # API가 redis 큐에 넣은 vod_id를 꺼내 채팅을 수집한다.
  review-collector-worker:
    build:
      context: .
      dockerfile: docker/review_collector.Dockerfile
    container_name: soop_bridge_review_collector_worker
    restart: unless-stopped
    command: ["python", "-m", "app.broadcast.review.collector", "worker"]
    # 컨테이너 stop 시 python을 안전하게 종료하기 위해 init과 SIGINT를 사용
    init: true
    stop_signal: SIGINT
    # 컨테이너 stop 시 기다리는 시간.
    stop_grace_period: 30s
    env_file: .env
    environment:
      PGAPPNAME: review-worker
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Asia/Seoul
      RUN_SOURCE: worker   # 로그에 [worker] 표시
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging


  # 라이브 collector. 방송 중인 스트리머의 채팅, 영상 주소, 방송 현황을 redis에 올린다.
  # 로그 확인: docker compose logs -f live-collector
  live-collector:
    build:
      context: .
      dockerfile: docker/live_collector.Dockerfile
    container_name: soop_bridge_live_collector
    restart: unless-stopped
    # 컨테이너 stop 시 python을 안전하게 종료하기 위해 init과 SIGINT를 사용
    init: true
    stop_signal: SIGINT
    # 컨테이너 stop 시 기다리는 시간.
    stop_grace_period: 10s
    # 시작할 때 streamers 테이블에서 감시할 bid를 읽는다.
    env_file: .env
    environment:
      PGAPPNAME: live-collector
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Asia/Seoul
      RUN_SOURCE: live   # 로그에 [live] 표시
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging


  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: soop_bridge_api
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Asia/Seoul
      RUN_SOURCE: api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging


  # 설정 확인: docker compose exec nginx nginx -t
  # 설정 다시 읽기: docker compose exec nginx nginx -s reload
  nginx:
    image: nginx:stable-alpine
    container_name: soop_bridge_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
    logging: *default-logging


  # 실행: docker compose run --rm certbot <명령>
  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt


volumes:
  postgres_data:
  redis_data: