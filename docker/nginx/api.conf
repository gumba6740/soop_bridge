server {
    listen 80;
    server_name soop-bridge.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name soop-bridge.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/soop-bridge.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soop-bridge.duckdns.org/privkey.pem;

    # 도커 내부 DNS. api 컨테이너가 다시 만들어져 IP가 바뀌어도 따라간다
    resolver 127.0.0.11 valid=10s;


    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}